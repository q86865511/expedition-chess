[preset.0]

name="Windows Provisional RC"
platform="Windows Desktop"
runnable=true
dedicated_server=false
; B-09：provisional_rc 會啟用 --rc-smoke-phase CLI 驅動（含破壞性的
; restart-abandon-verify，會不可逆棄置 retained run，需另帶 --rc-smoke-confirm 才會執行）。
; 這個 feature tag 只給內部 RC smoke／balance-playtest 用，複製本 preset 給正式發行版時
; 務必移除，勿把它帶進公開 preset。
custom_features="provisional_rc"
export_filter="all_resources"
include_filter="localization/*.raw,application/balance/*.json"
exclude_filter="addons/gut/**,tests/*,specs/*,.pipeline/*,artifacts/*,tools/*,scenes/dev/*,scripts/dev/*,assets/production/attempts/*,assets/production/camp_attempts/*,assets/production/shared_attempts/*"
export_path="artifacts/rc/ExpeditionChess.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
shader_baker/enabled=false
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.3.0-rc1"
application/product_version="0.3.0-rc1"
application/company_name=""
application/product_name="Expedition Chess"
application/file_description="G2 balance-playtest provisional RC"
application/copyright=""
application/trademarks=""
application/export_angle=0
ssh_remote_deploy/enabled=false
